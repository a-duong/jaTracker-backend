name: Task
description: Create a development task for JA Tracker
title: "feat: "
labels: ["backend"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for implementation work.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the task
      placeholder: Add GET /jobs endpoint
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - frontend
        - database
        - api
        - ui
        - auth
        - docs
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Parent Epic
      description: Add the epic issue number
      placeholder: "#12"

  - type: textarea
    id: problem
    attributes:
      label: Problem / Context
      placeholder: Why does this task matter?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - Requirement 1
        - Requirement 2
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes

  - type: checkboxes
    id: done
    attributes:
      label: Definition of Done
      options:
        - label: Code runs locally
        - label: Acceptance criteria met
        - label: No errors
